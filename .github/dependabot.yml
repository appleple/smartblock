version: 2

# npm 依存のバージョン更新（脆弱性に関係のない追随）は行わない。prosemirror 系は更新のたびに
# 壊れる実績があり、開発ツールも peer の噛み合いで npm ci が解決不能になってグループ PR が
# 丸ごと止まるため（eslint-plugin-react-refresh 0.5 が eslint 9 以上を要求した例）。
# 脆弱性への対応は Dependabot security updates が担う（設定ファイルとは独立に動く機能で、
# production / development の両方を対象にする）。
#
# prosemirror 系は package.json で実バージョンに固定してあるので、レンジによる暗黙の
# 引き上げも起きない。上げるときは人が意図して外す。
updates:
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: ci
