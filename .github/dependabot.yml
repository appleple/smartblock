version: 2

updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    # 配布物に入る依存だけを対象にする。開発ツール（eslint / jest / webpack 系）は
    # 更新しても配布物に影響しない一方、peer の噛み合いが崩れて npm ci が解決不能になり
    # （実例: eslint-plugin-react-refresh 0.5 が eslint 9 以上を要求）、グループ PR 全体が
    # 止まる。開発ツールの脆弱性は Dependabot security updates 側で拾われる
    allow:
      - dependency-type: production
    groups:
      patch-and-minor:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
